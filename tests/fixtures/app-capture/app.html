<!doctype html>
<!-- A deliberately generic fixture UI for exercising the capture adapter. It is not a recording of any real product and
     must never stand in for one in a review: capture evidence always comes from the actual application under test. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Filters — fixture</title>
<style>
  :root { --ink:#14161a; --muted:#5c6570; --line:#dfe3e8; --bg:#f6f7f9; --accent:#2f6bff; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 Inter, system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:18px 26px; background:#fff; border-bottom:1px solid var(--line); }
  .logo { width:26px; height:26px; border-radius:7px; background:var(--accent); }
  .app { font-weight:650; font-size:16px; }
  .nav { margin-left:28px; display:flex; gap:22px; color:var(--muted); }
  .nav b { color:var(--ink); }
  main { display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 63px); }
  aside { border-right:1px solid var(--line); padding:22px 18px; background:#fbfcfd; }
  aside div { padding:9px 12px; border-radius:8px; color:var(--muted); }
  aside div.on { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 2px #0001; }
  section { padding:26px 32px; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:21px; margin:0; }
  button { font:inherit; font-weight:600; border:0; border-radius:9px; padding:10px 16px; background:var(--accent); color:#fff; cursor:pointer; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:13px 16px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; background:#eaf0ff; color:#2a54c8; font-weight:600; }
  #backdrop { position:fixed; inset:0; background:#0b10201f; display:none; }
  #dialog { position:fixed; top:22%; left:50%; transform:translateX(-50%); width:430px; background:#fff; border-radius:14px;
            box-shadow:0 24px 60px #0b102033; padding:22px; display:none; }
  #dialog h2 { margin:0 0 16px; font-size:18px; }
  label { display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  input, select { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .ghost { background:#eef1f5; color:var(--ink); }
  #toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:#14241a; color:#d6ffe6;
           padding:11px 18px; border-radius:10px; font-weight:600; opacity:0; transition:opacity .18s; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="logo"></div><div class="app">Acme Filters</div>
  <nav class="nav"><span>Dashboard</span><b>Filters</b><span>Settings</span></nav>
</header>
<main>
  <aside><div>Overview</div><div class="on">Filters</div><div>Segments</div><div>Settings</div></aside>
  <section>
    <div class="bar"><h1>Filters</h1><button id="new-filter">New filter</button></div>
    <table id="filters">
      <thead><tr><th>Name</th><th>Rule</th><th>Owner</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Enterprise trials</td><td>plan = enterprise</td><td>priya</td><td><span class="pill">live</span></td></tr>
        <tr><td>Weekly churn risk</td><td>seats &lt; 5</td><td>omar</td><td><span class="pill">live</span></td></tr>
      </tbody>
    </table>
  </section>
</main>
<div id="backdrop"></div>
<div id="dialog" role="dialog" aria-modal="true">
  <h2>New filter</h2>
  <label for="filter-name">Name</label>
  <input id="filter-name" placeholder="e.g. Bikes">
  <label for="filter-rule">Rule</label>
  <select id="filter-rule"><option>orders &gt; 10</option><option>seats &lt; 5</option></select>
  <div class="actions"><button class="ghost" id="cancel">Cancel</button><button id="save-filter">Save filter</button></div>
</div>
<div id="toast">Filter saved</div>
<script>
  const dialog = document.getElementById('dialog'), backdrop = document.getElementById('backdrop');
  document.getElementById('new-filter').onclick = () => { dialog.style.display = 'block'; backdrop.style.display = 'block'; };
  document.getElementById('cancel').onclick = close;
  function close() { dialog.style.display = 'none'; backdrop.style.display = 'none'; }
  document.getElementById('save-filter').onclick = () => {
    const name = document.getElementById('filter-name').value.trim() || 'Untitled';
    const rule = document.getElementById('filter-rule').value;
    const row = document.createElement('tr');
    row.innerHTML = `<td>${name}</td><td>${rule}</td><td>you</td><td><span class="pill">live</span></td>`;
    document.querySelector('#filters tbody').append(row);
    close();
    const toast = document.getElementById('toast');
    toast.classList.add('on');
    setTimeout(() => toast.classList.remove('on'), 1200);
  };
</script>
</body>
</html>
